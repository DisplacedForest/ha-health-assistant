[tasks.fmt]
run = "ruff format --check custom_components tests"

[tasks.lint]
run = "ruff check custom_components tests"

[tasks.test]
run = "pytest -q"

[tasks.frontend-install]
run = "npm --prefix frontend-src ci --no-fund --no-audit"

[tasks.frontend-lint]
depends = ["frontend-install"]
run = "npm --prefix frontend-src run lint"

[tasks.frontend-build]
depends = ["frontend-install"]
run = "npm --prefix frontend-src run build"

[tasks.check]
depends = ["fmt", "lint", "test", "frontend-lint", "frontend-build"]

[tasks.ci]
depends = ["check"]

[tasks.security]
run = "semgrep scan --config auto --error"

[tasks.install-dev]
run = "bash scripts/install_dev.sh"

[tasks.ha]
run = """
mkdir -p .ha-dev
docker run --rm -it --name health-assistant-dev \
  -p 8123:8123 \
  -v "$PWD/.ha-dev:/config" \
  -v "$PWD/custom_components:/config/custom_components" \
  ghcr.io/home-assistant/home-assistant:stable
"""
