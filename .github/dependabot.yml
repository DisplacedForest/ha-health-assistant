version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "requirements-test-minimum.txt"
    groups:
      home-assistant-test:
        patterns:
          - "home-assistant-frontend"
          - "pytest-homeassistant-custom-component"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
