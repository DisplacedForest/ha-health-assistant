name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    name: Format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test*.txt
      - run: pip install -r requirements-test.txt
      - run: ruff format --check custom_components tests

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test*.txt
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests

  test-matrix:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: stable
            requirements: requirements-test.txt
          - environment: minimum
            requirements: requirements-test-minimum.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test*.txt
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest -q

  test:
    runs-on: ubuntu-latest
    name: Test
    needs: test-matrix
    if: always()
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"

  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json
      - run: npm --prefix frontend-src ci --no-fund --no-audit
      - run: npm --prefix frontend-src run lint
      - run: npm --prefix frontend-src test
      - run: npm --prefix frontend-src run build
      - run: git ls-files --error-unmatch custom_components/health_assistant/frontend/dist/panel.js
      - run: git diff --exit-code custom_components/health_assistant/frontend/dist/panel.js
